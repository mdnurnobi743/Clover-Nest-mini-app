       and a bottom quick-action row (visual layer only — every id
       used by JS below is preserved so no function is touched).
       ══════════════════════════════════════════════════════════ */
    /* ⚠️ CHANGED (Emerald Professional v2) — brighter tinted glass fill
       (was flat --surface-raised, blended into the page) + a subtle
       animated light sheen sweeping across the card every few seconds —
       the bit of "alive" premium motion that was missing. */
    .bal-hero { position: relative; border-radius: 20px; padding: 20px 18px 18px; overflow: hidden; background: radial-gradient(ellipse 120% 90% at 100% -10%, var(--signal-soft), transparent 60%), linear-gradient(165deg, rgba(30,92,66,0.55), rgba(11,26,20,0.62)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--glass-border-violet); box-shadow: 0 0 0 1px rgba(255,197,61,0.06), 0 14px 30px rgba(0,0,0,0.35); }
    .bal-hero::after {
        content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.14) 50%, rgba(255,255,255,0.08) 55%, transparent);
        transform: skewX(-18deg); animation: hero-sheen 5.5s ease-in-out infinite; pointer-events: none; z-index: 2;
    }
    @keyframes hero-sheen { 0%, 25% { left: -60%; } 60%, 100% { left: 130%; } }
    .bal-hero-glow { position: absolute; top: -60px; right: -50px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, var(--coin-soft), transparent 70%); pointer-events: none; z-index: 0; }
    .bal-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
    .bal-hero-badge { width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: linear-gradient(155deg, var(--coin-soft), var(--surface-pop) 75%); border: 1px solid var(--coin-soft); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 21px; color: var(--coin); box-shadow: 0 0 18px var(--coin-soft), inset 0 1px 1px rgba(255,255,255,0.15); }
    .bal-hero-chip { font-size: 10.5px; color: var(--ink-faint); background: rgba(0,0,0,0.18); border: 0.5px solid var(--border); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
    .bal-hero-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 30px; color: #39FF6A; margin-top: 2px; }
    .bal-hero-ledger-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
    .bal-hero-ledger { font-size: 10.5px; color: #91A69D; background: rgba(0,0,0,0.18); border: 0.5px solid var(--border); padding: 4px 10px; border-radius: 999px; }
    .bal-hero-ledger b { color: #FFD43B; font-weight: 600; font-family: var(--font-mono); }
    .bal-hero-rate { margin-top: 8px; font-size: 11px; color: #B8C5BF; position: relative; z-index: 1; }

    /* quick-link 2x2 grid — Weekly Contest / Leaderboard / Official / Pay */
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick-grid-card { display: flex; align-items: center; gap: 10px; padding: 12px 12px; border-radius: 16px; border: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); text-align: left; }
    .quick-grid-card:active { transform: scale(0.97); }
    .quick-grid-icon { width: 36px; height: 36px; flex-shrink: 0; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .quick-grid-title { font-size: 12.5px; font-weight: 600; color: var(--ink); line-height: 1.25; }
    .quick-grid-sub { font-size: 10px; color: var(--ink-faint); margin-top: 1px; }

    /* bottom quick-action row — 5 circular icons, 2 wired live, 3 "coming soon" */
    .qa-row { display: flex; justify-content: space-between; gap: 4px; }
    .qa-item { display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1; position: relative; background: none; border: none; padding: 0; }
    .qa-item:active .qa-icon { transform: scale(0.92); }
    .qa-icon { position: relative; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1.5px solid var(--border-strong); background: var(--surface-raised); transition: transform 0.14s ease; }
    .qa-icon.qa-active { background: radial-gradient(circle, var(--coin-soft), var(--surface-raised) 78%); border-color: var(--coin-soft); box-shadow: 0 0 14px var(--coin-soft); }
    .qa-label { font-size: 10.5px; font-weight: 600; color: var(--ink); text-align: center; line-height: 1.2; }
    .qa-sub { font-size: 9px; color: var(--ink-faint); text-align: center; }
    .qa-soon-badge { position: absolute; top: -4px; right: 2px; background: var(--pending); color: var(--pending-ink); font-size: 7.5px; font-weight: 700; letter-spacing: 0.02em; padding: 2px 5px; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    /* ══════════════════════════════════════════════════════════
       WITHDRAW 2.0 — brand new step-based flow, violet "wallet"
       accent, radio-card method picker, quick-% chip row, and a
       dedicated confirm + success screen instead of one long form.
       ══════════════════════════════════════════════════════════ */
    .wd2-steps { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; position: relative; z-index: 1; }
    .wd2-step-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: var(--font-display); background: var(--surface-raised); border: 1.5px solid var(--border-strong); color: var(--ink-faint); flex-shrink: 0; transition: all 0.25s ease; }
    .wd2-step-dot.done { background: var(--signal); border-color: var(--signal); color: #fff; }
    .wd2-step-dot.active { background: radial-gradient(circle, var(--signal-soft), var(--surface-raised) 75%); border-color: var(--signal); color: var(--ink); box-shadow: 0 0 12px var(--signal-soft); }
    .wd2-step-label { font-size: 11px; color: var(--ink-faint); font-weight: 600; }
    .wd2-step-label.active { color: var(--ink); }
    .wd2-step-line { flex: 1; height: 1.5px; background: var(--border-strong); }
    .wd2-step-line.done { background: var(--signal); }

    .wd2-balance-card { position: relative; overflow: hidden; border-radius: 18px; padding: 16px 18px; margin-bottom: 16px; background: linear-gradient(135deg, rgba(124,60,255,0.16), var(--glass-bg) 70%); border: 1px solid var(--glass-border-violet); }
    .wd2-balance-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); }
    .wd2-balance-num { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin-top: 3px; color: var(--ink); }
    .wd2-balance-usd { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; }

    .wd2-section-label { font-size: 11.5px; font-weight: 600; color: var(--ink-muted); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .wd2-method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .wd2-method-card { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 12px; border-radius: 14px; border: 1.5px solid var(--border-strong); background: var(--surface-raised); text-align: left; position: relative; transition: all 0.18s ease; }
    .wd2-method-card.selected { border-color: var(--signal); background: linear-gradient(155deg, var(--signal-soft), var(--surface-raised) 75%); box-shadow: 0 0 14px var(--signal-soft); }
    .wd2-method-icon { width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--signal-soft); color: var(--signal); }
    .wd2-method-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
    .wd2-method-radio { position: absolute; top: 10px; right: 10px; width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--border-strong); }
    .wd2-method-card.selected .wd2-method-radio { border-color: var(--signal); background: var(--signal); box-shadow: inset 0 0 0 3px var(--surface-raised); }

    .wd2-chip-row { display: flex; gap: 7px; margin-top: 8px; }
    .wd2-chip { flex: 1; padding: 7px 0; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-raised); color: var(--ink-muted); font-size: 11.5px; font-weight: 600; text-align: center; }
    .wd2-chip:active { transform: scale(0.95); }
    .wd2-chip.max { color: var(--signal); border-color: var(--signal-soft); }

    .wd2-receive-card { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--money-soft); border: 1px solid rgba(0,245,212,0.28); }
    .wd2-receive-label { font-size: 12px; color: var(--ink-muted); }
    .wd2-receive-num { font-family: var(--font-mono); font-size: 19px; font-weight: 700; color: var(--money); }

    .wd2-req-card { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface-raised); border: 1px solid var(--border); }
    .wd2-req-line { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 4px 0; }

    .wd2-summary-card { border-radius: 16px; background: var(--surface-raised); border: 1px solid var(--border); padding: 4px 16px; margin-bottom: 14px; }
    .wd2-summary-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 13px; }
    .wd2-summary-row + .wd2-summary-row { border-top: 1px solid var(--border); }
    .wd2-summary-row .lbl { color: var(--ink-faint); }
    .wd2-summary-row .val { color: var(--ink); font-weight: 600; font-family: var(--font-mono); text-align: right; }
    .wd2-summary-net { border-radius: 16px; background: var(--money-soft); border: 1px solid rgba(0,245,212,0.28); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .wd2-summary-net .lbl { font-size: 12.5px; color: var(--ink-muted); }
    .wd2-summary-net .val { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--money); }

    .wd2-success-badge { width: 72px; height: 72px; border-radius: 50%; margin: 6px auto 16px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, var(--money-soft), transparent 72%); border: 2px solid var(--money); animation: wd2-pop 0.45s cubic-bezier(.22,.9,.32,1); }
    @keyframes wd2-pop { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<div id="galaxy-bg">
    <div class="amb-orb o1"></div>
    <div class="amb-orb o2"></div>
    <div class="amb-orb o3"></div>
    <div class="amb-sweep"></div>
</div>
<div id="amb-clovers"></div>
<div id="amb-dust"></div>
<div id="grain-overlay"></div>

<div id="splash">
    <div class="splash-bg-glow"></div>
    <div class="splash-particles"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="splash-video-scrim"></div>
    <div class="splash-overlay">
        <div class="splash-icon-stage">
            <div class="splash-beam"></div>
            <div class="splash-badge">
                <div class="splash-badge-inner">
                    <div class="splash-badge-sheen"></div>
                    <span class="splash-clover">🍀</span>
                </div>
            </div>
            <div class="splash-ripple-pool">
                <div class="splash-ripple"></div>
                <div class="splash-ripple r2"></div>
                <div class="splash-ripple r3"></div>
                <div class="core"></div>
            </div>

// ══════════════════════════════════════════════════════════════
// GALAXY BACKGROUND — generates two star-density layers using a
// single box-shadow trick (one real element, hundreds of "stars"
// ══════════════════════════════════════════════════════════════
// ⚠️ FIXED — this block used to `return` immediately (leftover from an
// older "fully static background" theme decision). That early return was
// never removed when the background was later re-animated per the
// "Background Animation UX" spec (5 layers), so Layers 2 & 3 — Floating
// Clovers and Particle Dust — had CSS animations defined but were never
// actually generated/appended to the DOM, i.e. they silently did nothing.
// The old star-dust/box-shadow generator (for the previous "galaxy" theme)
// has been removed outright since #star-layer/.galaxy-nebula have no CSS
// backing it anymore and stars aren't part of the current 5-layer spec.
// ══════════════════════════════════════════════════════════════
(function initGalaxyBackground() {
    // Layers 2 & 3 of the ambient background spec — Floating Clovers (very
    // slow upward drift) and Particle Dust (slow upward drift + fade).
    // Generated once here rather than hardcoded so positions/timings don't
    // repeat in an obviously looping pattern.
    const cloverLayer = document.getElementById('amb-clovers');
    if (cloverLayer) {
        for (let i = 0; i < 7; i++) {
            const leaf = document.createElement('span');
            leaf.textContent = '🍀';
            leaf.style.left = (Math.random() * 96).toFixed(1) + '%';
            leaf.style.fontSize = (Math.random() * 10 + 12).toFixed(0) + 'px';
            leaf.style.animationDuration = (Math.random() * 10 + 22).toFixed(1) + 's'; // 22–32s: "very slow"
            leaf.style.animationDelay = (Math.random() * -30).toFixed(1) + 's'; // negative = already mid-flight on load
            cloverLayer.appendChild(leaf);
        }
    }
    const dustLayer = document.getElementById('amb-dust');
    if (dustLayer) {
        for (let i = 0; i < 16; i++) {
            const dot = document.createElement('span');
            dot.style.left = (Math.random() * 98).toFixed(1) + '%';
            const size = (Math.random() * 2 + 2).toFixed(1) + 'px';
            dot.style.width = size; dot.style.height = size;
            dot.style.animationDuration = (Math.random() * 6 + 14).toFixed(1) + 's'; // 14–20s: "slow"
            dot.style.animationDelay = (Math.random() * -20).toFixed(1) + 's';
            dustLayer.appendChild(dot);
        }
    }
})();

const tg = window.Telegram?.WebApp;
if (tg) { try { tg.ready(); } catch (e) {} try { tg.expand(); } catch (e) {} try { tg.setHeaderColor('#0A0F0C'); } catch (e) {} }

// ⚠️ SECURITY: USER_ID/FIRST_NAME/USERNAME here are for DISPLAY ONLY (cosmetic).
// They are never sent to the backend as a trusted identity — every API call
// sends the raw signed `tg.initData` string instead, and the server verifies
// it cryptographically (see lib/telegramAuth.js) before trusting any user id.
// This prevents anyone from forging requests with someone else's userId.
let USER_ID = null, FIRST_NAME = 'User', USERNAME = 'N/A', PHOTO_URL = null, startParam = null;
let TG_INIT_DATA = tg?.initData || '';

function hydrateDisplayUserFields() {
    TG_INIT_DATA = tg?.initData || ''; // re-read fresh each time — Telegram's bridge can deliver this late
    const u = tg?.initDataUnsafe?.user;
    if (!u || !TG_INIT_DATA) return false;
    USER_ID = String(u.id);
    FIRST_NAME = u.first_name || 'User';
    USERNAME = u.username || 'N/A';
    PHOTO_URL = u.photo_url || null; // only present if the user has a public profile photo
    startParam = tg?.initDataUnsafe?.start_param || null;
    return true;
}

const state = { user: null, tasks: [], leaderboard: [], activeTab: 'home' };

// TOAST
// ══════════════════════════════════════════════════════════════
function toast(message, type = 'info') {
    const host = document.getElementById('toast-host');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

// ══════════════════════════════════════════════════════════════
// API helpers — apiPost automatically attaches the signed Telegram
// initData to every request, so individual call sites never need to
// (and never should) pass a raw userId — the server derives it from
// the verified session instead.
// ⚠️ FIX — fetch() previously had NO timeout, so on a slow/dead mobile
// connection this could hang forever, leaving the user stuck on the splash
// screen's static "92%" bar with zero feedback and no way to recover short
// of force-closing the app. Now every call aborts after API_TIMEOUT_MS and
// resolves to {ok:false, error:'timeout'} instead of hanging indefinitely.
// ══════════════════════════════════════════════════════════════
const API_TIMEOUT_MS = 15000;
async function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), API_TIMEOUT_MS);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } finally { clearTimeout(t); }
}
async function apiPost(path, body = {}) {
    try {
        const res = await fetchWithTimeout(`${API_BASE}/${path}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...body, initData: TG_INIT_DATA }),
        });
        return await res.json();
    } catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'server_error' }; }
}
async function apiGet(path) {
    try { const res = await fetchWithTimeout(`${API_BASE}/${path}`); return await res.json(); }
    catch (e) { return { ok: false, error: e?.name === 'AbortError' ? 'timeout' : 'server_error' }; }
}
function fmtWTC(n) { return Math.floor(n || 0).toLocaleString('en-US'); }
function wtcToUsd(wtc) { return (wtc / WTC_PER_USD_DISPLAY).toFixed(4); }

// ══════════════════════════════════════════════════════════════
// PARTICLE BURST — lightweight canvas confetti for reward moments
// (claim lootbox, ad reward, task complete, withdraw, promo redeem).
// Self-contained, auto-clears after ~1s — never blocks interaction.
// ══════════════════════════════════════════════════════════════
const burstCanvas = document.getElementById('burst-canvas');
const burstCtx = burstCanvas.getContext('2d');
function resizeBurstCanvas() { burstCanvas.width = window.innerWidth; burstCanvas.height = window.innerHeight; }
resizeBurstCanvas();
window.addEventListener('resize', resizeBurstCanvas);

function triggerBurst(originEl) {
    const rect = originEl ? originEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0 };
    const ox = rect.left + rect.width / 2;
    const oy = rect.top + rect.height / 2;
    const colors = ['#12C48B', '#22C55E', '#F0B429', '#F1F8F4'];
    const particles = Array.from({ length: 26 }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 4.5;
        return { x: ox, y: oy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, size: 3 + Math.random() * 4, color: colors[Math.floor(Math.random() * colors.length)], life: 1 };
    });
    let frame = 0;
    function tick() {
        frame++;
        burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
        let alive = false;
        particles.forEach(p => {
            if (p.life <= 0) return;
            p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life -= 0.022;
            if (p.life > 0) {
                alive = true;
                burstCtx.globalAlpha = Math.max(p.life, 0);
                burstCtx.fillStyle = p.color;
                burstCtx.beginPath(); burstCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); burstCtx.fill();
            }
        });
        burstCtx.globalAlpha = 1;
        if (alive && frame < 90) requestAnimationFrame(tick);
        else burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
    }
    tick();
}

// ══════════════════════════════════════════════════════════════
// COUNT-UP — animates a number from its current value to a new target
// ══════════════════════════════════════════════════════════════
function animateCountUp(el, from, to, duration = 700) {
    if (!el) return;
    const start = performance.now();
    const diff = to - from;
    function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        el.textContent = fmtWTC(from + diff * eased);
        if (t < 1) requestAnimationFrame(step);
        else el.textContent = fmtWTC(to);
    }
    requestAnimationFrame(step);
}

async function openHistoryModal() {

    // routes to its own (still "coming soon") bottom-nav tab.

    document.getElementById('home-spin-btn').onclick = () => switchTab('spin');
    document.getElementById('home-promo-submit').onclick = () => redeemPromoCode(
        document.getElementById('home-promo-input').value.trim(),
        document.getElementById('home-promo-submit'),
        () => { if (state.activeTab === 'home') renderHome(); }
    );

    // Platform-wide stats: real live counts from the new data?type=platformStats
    // aggregate (see api/data.js) — Total Users, Clover Collected (sum of
    // every user's lifetime WTC earned), Total Withdrawn (sum of all
    // approved withdrawals in USD). Runs after the initial paint so it
    // doesn't block Home from showing (skeleton -> number).
    (async () => {
        const r = await apiGet('data?type=platformStats');
        const statsEl = document.getElementById('home-platform-stats');
        if (!statsEl) return; // user navigated away before this resolved
        const nums = statsEl.querySelectorAll('.stat-strip-num.skel');
        if (!r.ok) { nums.forEach(n => { n.classList.remove('skel'); n.style.cssText = ''; n.textContent = '—'; }); return; }
        const vals = [r.totalUsers, r.totalCloverCollected, `$${fmtAbbrev(r.totalWithdrawnUsd)}`];
        nums.forEach((n, i) => {
            n.classList.remove('skel'); n.style.cssText = '';
            n.textContent = i === 2 ? vals[i] : fmtAbbrev(vals[i]);
        });
    })();
}

// "25.6K" / "3.2M" style abbreviation for the Platform Stats strip.
function fmtAbbrev(n) {
    n = Number(n) || 0;
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
}

// Shared promo-redeem flow (ad-gate -> claim), used by BOTH the inline Home
// promo box and the openPromoModal() popup, so the anti-abuse "must watch an
// ad before the code is spent" behavior can't drift out of sync between them.
async function redeemPromoCode(code, btn, onSuccess) {
    if (!code) return toast('Please enter a code.', 'error');
    const originalLabel = btn.textContent;
    btn.textContent = 'Checking...'; btn.disabled = true;

    const r = await apiPost('earn', { action: 'claimPromo', code });
    if (r.ok) {
        toast(`+${r.reward} CN added!`, 'success');
        triggerBurst(btn);
        showCongrats(`+${r.reward} CN`, '🎁');
        await refreshUser();
        onSuccess?.();
    } else {
        toast(errorText(r.error), 'error');
    }
    btn.textContent = originalLabel; btn.disabled = false;
}

const WITHDRAW_METHODS_UI = {
    binance:   { label: 'Binance UID', short: 'Binance', currency: 'USDT', placeholder: 'Enter your Binance UID',
                 icon: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 3-3 3-3-3 3-3zM12 16l3 3-3 3-3-3 3-3zM2 12l3-3 3 3-3 3-3-3zM16 12l3-3 3 3-3 3-3-3z"/></svg>' },
    tonkeeper: { label: 'Tonkeeper Address', short: 'Tonkeeper', currency: 'USDT', placeholder: 'UQ... wallet address',
                 icon: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM8 10l4-4 4 4M12 6v10"/></svg>' },
};

function calcNetUsdDisplay(wtc) {
    const gross = wtc / WTC_PER_USD_DISPLAY;
    const afterFirstFee = gross * (1 - WITHDRAW_FEE_PERCENT_DISPLAY / 100);
    const net = afterFirstFee * (1 - WITHDRAW_SECOND_FEE_PERCENT_DISPLAY / 100);
    return net;
}

function wd2StepsHtml(activeStep) {
    // activeStep: 1 = Amount, 2 = Confirm, 3 = Done
    const step = (n, label) => `
        <div class="wd2-step-dot ${activeStep > n ? 'done' : ''} ${activeStep === n ? 'active' : ''}">${activeStep > n ? '✓' : n}</div>
        <div class="wd2-step-label ${activeStep >= n ? 'active' : ''}">${label}</div>`;
    return `
        <div class="wd2-steps">
            ${step(1, 'Amount')}
            <div class="wd2-step-line ${activeStep > 1 ? 'done' : ''}"></div>
            ${step(2, 'Confirm')}
            <div class="wd2-step-line ${activeStep > 2 ? 'done' : ''}"></div>
            ${step(3, 'Done')}
        </div>`;
}

function openWithdrawModal() {
    let method = 'binance';
    let status = null;       // full GET ?action=status response
    let loadFailed = false;
    let withdrawalsOpen = true;
    let amount = 0;
    let details = '';

    function renderClosed() {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.5;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    <div style="position:relative; z-index:1; text-align:center; padding:12px 4px 4px;">
                        <div style="font-size:34px; margin-bottom:10px;">🔒</div>
                        <div class="section-title" style="margin-bottom:8px;">Withdrawals are closed</div>
                        <div class="muted" style="font-size:13px; line-height:1.6; margin-bottom:20px;">New withdraw requests aren't being accepted right now. Any request you already submitted before this will still be reviewed and paid normally.</div>
                        <button class="btn btn-outline" id="wd-closed-ok" style="width:100%;">Close</button>
                    </div>
                </div>
            </div>`;
        const okBtn = document.getElementById('wd-closed-ok');
        if (okBtn) okBtn.onclick = () => { document.getElementById('modal-root').innerHTML = ''; };
    }

    function reqLine(label, met, detail) {
        return `
        <div class="wd2-req-line" style="color:${met ? 'var(--success)' : 'var(--pending)'};">
            <span>${met ? '✅' : '⏳'}</span><span>${label}${detail ? ` <span class="muted" style="color:inherit; opacity:0.85;">${detail}</span>` : ''}</span>
        </div>`;
    }

    // ── STEP 1 — Amount & Method ──────────────────────────────
    function renderStep1() {
        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="max-height:90vh; display:flex; flex-direction:column; position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.4;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    ${wd2StepsHtml(1)}

                    <div style="overflow-y:auto; flex:1; position:relative; z-index:1;">
                        <div class="wd2-balance-card">
                            <div class="wd2-balance-label">Available balance</div>
                            <div class="wd2-balance-num" id="wd2-balance-num">${fmtWTC(wtcBalance)} CN</div>
                            <div class="wd2-balance-usd">≈ $${wtcToUsd(wtcBalance)} USD</div>
                        </div>

                        <div class="wd2-section-label">Payout method</div>
                        <div class="wd2-method-grid">
                            ${Object.entries(WITHDRAW_METHODS_UI).map(([key, cfg]) => `
                                <button type="button" class="wd2-method-card ${method === key ? 'selected' : ''}" data-method="${key}">
                                    <div class="wd2-method-radio"></div>
                                    <div class="wd2-method-icon">${cfg.icon}</div>
                                    <div class="wd2-method-name">${cfg.short}</div>
                                </button>`).join('')}
                        </div>

                        <div class="wd2-section-label">${WITHDRAW_METHODS_UI[method].label}</div>
                        <input class="field-input" id="wd-details" placeholder="${WITHDRAW_METHODS_UI[method].placeholder}" value="${details.replace(/"/g, '&quot;')}" style="margin-top:0;">

                        <div class="wd2-section-label">Amount to withdraw</div>
                        <input class="field-input" id="wd-amount" type="number" placeholder="${MIN_WITHDRAW_WTC}" value="${amount || ''}" style="margin-top:0;">
                        <div class="wd2-chip-row">
                            <button type="button" class="wd2-chip" data-pct="25">25%</button>
                            <button type="button" class="wd2-chip" data-pct="50">50%</button>
                            <button type="button" class="wd2-chip" data-pct="75">75%</button>
                            <button type="button" class="wd2-chip max" data-pct="100">MAX</button>
                        </div>
                        <div class="muted" style="font-size:11px; margin-top:8px;">${fmtWTC(WTC_PER_USD_DISPLAY)} CN = 1 USDT · minimum ${fmtWTC(MIN_WITHDRAW_WTC)} CN</div>

                        <div class="wd2-receive-card">
                            <span class="wd2-receive-label">You'll receive</span>
                            <span id="wd2-receive" class="wd2-receive-num">$0.0000</span>
                        </div>

                        <div class="wd2-req-card" id="wd2-req-card">
                            <div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0;">${loadFailed ? "Couldn't load requirements — try again." : 'Loading requirements...'}</div>
                        </div>
                    </div>

                    <button class="btn btn-primary" style="margin-top:14px; position:relative; z-index:1; background:linear-gradient(100deg, var(--signal), #A855F7 130%);" id="wd2-next" disabled>Loading...</button>
                </div>
            </div>`;

        document.querySelectorAll('[data-method]').forEach(btn => {
            btn.onclick = () => { method = btn.dataset.method; details = ''; renderStep1(); };
        });
        document.querySelectorAll('[data-pct]').forEach(chip => {
            chip.onclick = () => {
                const pct = parseInt(chip.dataset.pct, 10) / 100;
                const cap = (status?.referralRequirement?.isFirstWithdrawFree)
                    ? Math.min(wtcBalance, status.referralRequirement.firstWithdrawMaxWtc)
                    : wtcBalance;
                document.getElementById('wd-amount').value = Math.floor(cap * pct);
                updateStep1();
            };
        });
        document.getElementById('wd-amount').oninput = updateStep1;
        document.getElementById('wd-details').oninput = updateStep1;
        document.getElementById('wd2-next').onclick = goToStep2;
        updateStep1();
        renderRequirements();
    }

    function renderRequirements() {
        const card = document.getElementById('wd2-req-card');
        if (!card) return;
        if (!status) {
            card.innerHTML = `<div class="muted" style="font-size:12.5px; text-align:center; padding:6px 0;">${loadFailed ? "Couldn't load requirements — try again." : 'Loading requirements...'}</div>`;
            return;
        }
        card.innerHTML = `
            ${reqLine(`Complete ${status.withdrawRequirements.tasksRequired} tasks`, status.withdrawRequirements.tasksMet, `(${status.withdrawRequirements.tasksHave}/${status.withdrawRequirements.tasksRequired})`)}
            ${status.referralRequirement.isFirstWithdrawFree
                ? reqLine(`First withdrawal — free, up to ${fmtWTC(status.referralRequirement.firstWithdrawMaxWtc)} CN`, true, '')
                : reqLine('Valid referral available', status.referralRequirement.met, `(${status.referralRequirement.validReferralsAvailable} available)`)}
        `;
    }

    function updateStep1() {
        const amountEl = document.getElementById('wd-amount');
        const detailsEl = document.getElementById('wd-details');
        const btn = document.getElementById('wd2-next');
        const receiveEl = document.getElementById('wd2-receive');
        if (!amountEl || !btn) return;

        const wtc = Math.floor(parseFloat(amountEl.value) || 0);
        amount = wtc;
        details = detailsEl ? detailsEl.value.trim() : details;
        receiveEl.textContent = `$${calcNetUsdDisplay(wtc).toFixed(4)}`;

        if (!status) { btn.disabled = true; btn.textContent = loadFailed ? 'Retry' : 'Loading...'; return; }

        const u = state.user || {};
        const wtcBalance = u.wtcBalance || 0;
        const reqOk = status.withdrawRequirements.tasksMet;
        const refOk = status.referralRequirement.met;

        if (loadFailed) { btn.disabled = false; btn.textContent = 'Retry'; return; }
        if (!details) { btn.disabled = true; btn.textContent = `Enter your ${WITHDRAW_METHODS_UI[method].currency} address`; return; }
        if (wtc < MIN_WITHDRAW_WTC) { btn.disabled = true; btn.textContent = `Minimum ${fmtWTC(MIN_WITHDRAW_WTC)} CN`; return; }
        if (wtc > wtcBalance) { btn.disabled = true; btn.textContent = 'Insufficient CN balance'; return; }
        if (status.referralRequirement.isFirstWithdrawFree && wtc > status.referralRequirement.firstWithdrawMaxWtc) {
            btn.disabled = true; btn.textContent = `Free first withdrawal capped at ${fmtWTC(status.referralRequirement.firstWithdrawMaxWtc)} CN`; return;
        }
        if (!reqOk) { btn.disabled = true; btn.textContent = 'Complete requirements above'; return; }
        if (!refOk) { btn.disabled = true; btn.textContent = 'Need 1 valid referral'; return; }
        btn.disabled = false;
        btn.textContent = 'Continue';
    }

    function goToStep2() {
        renderStep2();
    }

    // ── STEP 2 — Confirm ──────────────────────────────────────
    function renderStep2() {
        const m = WITHDRAW_METHODS_UI[method];
        const net = calcNetUsdDisplay(amount);

        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="max-height:90vh; display:flex; flex-direction:column; position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.4;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    ${wd2StepsHtml(2)}

                    <div style="overflow-y:auto; flex:1; position:relative; z-index:1;">
                        <div class="section-title" style="margin-bottom:12px;">Review your withdrawal</div>
                        <div class="wd2-summary-card">
                            <div class="wd2-summary-row"><span class="lbl">Method</span><span class="val">${m.icon} ${m.short}</span></div>
                            <div class="wd2-summary-row"><span class="lbl">Destination</span><span class="val" style="word-break:break-all; max-width:170px;">${details}</span></div>
                            <div class="wd2-summary-row"><span class="lbl">Amount</span><span class="val">${fmtWTC(amount)} CN</span></div>
                            <div class="wd2-summary-row"><span class="lbl">Convert fee (${WITHDRAW_FEE_PERCENT_DISPLAY}%)</span><span class="val">− $${(amount / WTC_PER_USD_DISPLAY - net).toFixed(4)}</span></div>
                        </div>
                        <div class="wd2-summary-net">
                            <span class="lbl">Net you receive</span>
                            <span class="val">$${net.toFixed(4)}</span>
                        </div>
                        <div class="muted" style="font-size:11.5px; line-height:1.6; text-align:center; padding:0 6px;">Your request goes to our team for review. Paid out once approved — you can track it any time from your profile.</div>
                    </div>

                    <div style="display:flex; gap:10px; margin-top:14px; position:relative; z-index:1;">
                        <button class="btn btn-outline" id="wd2-back" style="flex:1;">Back</button>
                        <button class="btn btn-primary" id="wd2-confirm" style="flex:2; background:linear-gradient(100deg, var(--signal), #A855F7 130%);">Confirm &amp; Submit</button>
                    </div>
                </div>
            </div>`;

        document.getElementById('wd2-back').onclick = renderStep1;
        document.getElementById('wd2-confirm').onclick = submitWithdraw;
    }

    // ── STEP 3 — Success ──────────────────────────────────────
    function renderStep3(netUsd) {
        document.getElementById('modal-root').innerHTML = `
            <div class="overlay" onclick="if(event.target===this)this.remove()">
                <div class="sheet anim-in" style="text-align:center; position:relative; overflow:hidden;">
                    <div class="jg-glow" style="opacity:0.5;"></div>
                    <div class="sheet-handle" style="position:relative; z-index:1;"></div>
                    ${wd2StepsHtml(3)}
                    <div style="position:relative; z-index:1;">
                        <div class="wd2-success-badge">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--money)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                        </div>
                        <div class="section-title" style="margin-bottom:8px;">Request submitted</div>
                        <div class="muted" style="font-size:13px; line-height:1.6; margin-bottom:18px;">You'll receive <b style="color:var(--money);">$${netUsd.toFixed(4)}</b> once it's approved. We'll notify you here.</div>
                        <button class="btn btn-primary" id="wd2-done" style="width:100%; background:linear-gradient(100deg, var(--signal), #A855F7 130%);">Done</button>
                    </div>
                </div>
            </div>`;
        document.getElementById('wd2-done').onclick = () => { document.getElementById('modal-root').innerHTML = ''; };
    }

    async function loadStatus() {
        const r = await apiGet(`withdraw?action=status&initData=${encodeURIComponent(TG_INIT_DATA)}`);
        if (!r.ok) {
            loadFailed = true;
            updateStep1();
            renderRequirements();
            return;
        }
        if (r.withdrawalsOpen === false) {
            withdrawalsOpen = false;
            renderClosed();
            return;
        }
        loadFailed = false;
        status = r;
        updateStep1();
        renderRequirements();
    }

    async function submitWithdraw() {
        if (loadFailed) { loadStatus(); return; }
        if (!details) return toast('Please enter your address/UID.', 'error');
        if (!amount) return toast('Please enter an amount.', 'error');

        const btn = document.getElementById('wd2-confirm');
        btn.textContent = 'Submitting...'; btn.disabled = true;
        const r = await apiPost('withdraw', { method, details, wtcAmount: amount });
        if (r.ok) {
            triggerBurst(btn);
            await refreshUser();
            if (state.activeTab === 'home') renderHome();
            renderStep3(r.netUsd ?? calcNetUsdDisplay(amount));
        } else {
            toast(r.message || errorText(r.error), 'error');
            btn.textContent = 'Confirm & Submit'; btn.disabled = false;
            await loadStatus();
        }
    }

    renderStep1();
    loadStatus();
}

async function renderTaskTab() {
    // ⚠️ UPDATED — Daily-task system removed entirely per request; Task
    // section now only shows Exclusive / Partner / Earning categories.
    const TASK_TABS = [
        { id: 'exclusive', label: '⭐ Exclusive' },
        { id: 'partner', label: '🤝 Partner' },
        { id: 'earning', label: '👥 Earning' },
    ];
    if (!state.taskSubTab || !TASK_TABS.some(t => t.id === state.taskSubTab)) state.taskSubTab = 'exclusive';
    const root = document.getElementById('tab-content');
    const doneToday = state.user?.tasksCompletedToday || 0;
    root.innerHTML = `
        <div class="section-pad anim-in" style="margin-top:18px;">
            <div class="section-title" style="margin-bottom:4px;">Complete tasks, earn CN</div>
            <div class="muted" style="font-size:12.5px; margin-bottom:14px;">✅ ${doneToday} completed today — keep the streak going!</div>
            <div class="subnav-scroll">
                ${TASK_TABS.map(t => `<button class="subnav-btn ${state.taskSubTab === t.id ? 'active' : ''}" data-subtab="${t.id}">${t.label}</button>`).join('')}
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;" id="task-page-list">
                <div class="skel" style="height:78px; border-radius:16px;"></div>
                <div class="skel" style="height:78px; border-radius:16px;"></div>
                <div class="skel" style="height:78px; border-radius:16px;"></div>
            </div>
        </div>`;

    root.querySelectorAll('.subnav-btn[data-subtab]').forEach(btn => {
        btn.onclick = () => { state.taskSubTab = btn.dataset.subtab; renderTaskTab(); };
    });

    const r = await apiGet('data?type=tasks');
    state.tasks = r.ok ? r.tasks : [];
    const done = new Set(state.user?.completedTasks || []);
    const listEl = document.getElementById('task-page-list');
    if (!listEl) return; // sub-tab may have changed while this was loading

    // ⚠️ A completed task is no longer shown in the list — after it vanishes
    // with an animation this is the intended behavior, so it's filtered out
    // right here.
    const items = state.tasks.filter(t => !done.has(t._id) && (t.category || 'partner') === state.taskSubTab);

    if (!items.length) {
        listEl.innerHTML = `
            <div class="anim-in" style="text-align:center; padding:34px 0 18px;">
                <div style="font-size:38px; margin-bottom:10px;">🍃</div>
                <div class="muted" style="font-size:13px;">No tasks in this category right now.<br>Check back later!</div>

        return;
    }
    listEl.innerHTML = items.map((t, i) => taskCardHtml(t, i)).join('');
    listEl.querySelectorAll('button[data-task]').forEach(btn => { btn.onclick = () => goToTask(btn.dataset.task, btn.dataset.url, btn.dataset.category, btn.dataset.verify); });
}

// meta per category: icon, badge text, and the CSS hue vars from the theme
// (see the --daily-hue/--exclusive-hue/etc. block up top).
const TASK_CATEGORY_META = {
    channel:   { icon: '📢', badge: '✓ Verified', hue: 'var(--task-hue)',      hueSoft: 'var(--task-soft)' },
    daily:     { icon: '📅', badge: 'Daily',       hue: 'var(--daily-hue)',     hueSoft: 'var(--daily-soft)' },
    exclusive: { icon: '⭐', badge: 'Exclusive',   hue: 'var(--exclusive-hue)', hueSoft: 'var(--exclusive-soft)' },
    partner:   { icon: '🤝', badge: 'Partner',     hue: 'var(--partner-hue)',   hueSoft: 'var(--partner-soft)' },
    earning:   { icon: '👥', badge: 'Earning',     hue: 'var(--earning-hue)',   hueSoft: 'var(--earning-soft)' },
};

function taskCardHtml(t, i = 0) {
    const cat = t.category || 'partner';
    const m = TASK_CATEGORY_META[cat] || TASK_CATEGORY_META.partner;
    // ⚠️ NEW (this update) — verifyType is now independent of category (any
    // category can be API-verified via Telegram join, not just 'channel').
    // Falls back to the old category-based rule for tasks saved before this
    // field existed.
    const verifyType = t.verifyType || (cat === 'channel' ? 'api' : 'link');
    // daily tasks priced in USDT show the USDT figure as the headline reward
    // (with CN as the small unit label swapped for "USDT") — the actual
    // credited amount is still rewardWtc under the hood, this is display-only.
    const isUsdt = t.rewardCurrency === 'usdt';
    const rewardAmount = isUsdt ? (t.rewardUsdt ?? 0) : (t.rewardWtc || 0);
    const rewardUnit = isUsdt ? 'USDT' : 'CN';
    return `
    <div class="card task-card-big" data-task-card="${t._id}" style="opacity:0; animation: rise-in 0.4s ease ${Math.min(i * 0.06, 0.36)}s forwards;">
        <div class="tc-icon" style="background:${m.hueSoft}; border-color:${m.hueSoft};">${m.icon}</div>
        <div style="flex:1; min-width:0;">
            <span class="pill" style="background:${m.hueSoft}; color:${m.hue}; margin-bottom:6px;">${m.badge}</span>
            <div class="tc-title">${t.title}</div>
            <button class="btn tc-go-btn" style="background:${m.hue}; box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), 0 6px 14px ${m.hueSoft};" data-task="${t._id}" data-url="${t.url || ''}" data-category="${cat}" data-verify="${verifyType}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Start
            </button>
        </div>
        <div class="tc-reward-badge">
            <div class="tc-reward-amount" style="color:${m.hue};">+${rewardAmount}</div>
            <div class="tc-reward-label">${rewardUnit}</div>
        </div>
    </div>`;
}

function goToTask(taskId, url, category, verifyType) {
    // Open the link first
    if (url) window.open(url, '_blank');

    // Then show the claim/verify sheet — user must actively press Claim
    const task = state.tasks.find(t => t._id === taskId);
    // ⚠️ CHANGED (this update) — was `category === 'channel'`. Now keyed off
    // verifyType so any category (Daily/Exclusive/Partner/Earning) can be an
    // API-verified (Telegram join) task, not just the dedicated Verify tab.
    const isVerified = verifyType === 'api';

    // ⚠️ NEW — issue a signed taskStart token the instant the sheet opens
    // (non-API-verified tasks only — API-verified tasks are independently
    // verified via real Telegram membership and don't need this). Stored in a
    // closure-scoped variable and sent along with the claim below — see
    // handleTaskStart/handleTaskComplete in api/earn.js for why.
    let taskToken = null;
    if (!isVerified) {
        apiPost('earn', { action: 'taskStart', taskId }).then(r => {
            if (r?.ok) taskToken = { startTime: r.startTime, signature: r.signature };
        });
    }

    document.getElementById('modal-root').innerHTML = `
        <div class="overlay" onclick="if(event.target===this)this.remove()">
            <div class="sheet anim-in">
                <div class="sheet-handle"></div>
                <div style="font-weight:600; font-size:16px; margin-bottom:6px;">${task?.title || 'Task'}</div>
                <div class="muted" style="font-size:13px; margin-bottom:18px;">
                    ${isVerified
                        ? 'After joining the channel/group, tap Verify below. Our server will check your membership.'
                        : 'After completing the task above, tap Claim to receive your reward.'}
                </div>
                ${isVerified ? `
                    <button class="btn btn-signal" id="task-verify-btn" style="margin-bottom:10px;">
                        ✅ Verify Membership
                    </button>` : `
                    <button class="btn btn-primary" id="task-claim-btn" style="margin-bottom:10px;" disabled>
                        🎁 Claim in <span id="task-claim-countdown">10</span>s
                    </button>`}
                <button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''">
                    Cancel
                </button>
            </div>
        </div>`;

    const actionBtn = document.getElementById('task-verify-btn') || document.getElementById('task-claim-btn');
    if (actionBtn) {
        actionBtn.onclick = async () => {
            actionBtn.disabled = true;
            actionBtn.textContent = 'Checking...';
            await completeTask(taskId, taskToken);
        };
    }

    // ⚠️ Soft anti-abuse friction (matches the read→wait→claim pattern from
    // reference apps) — link-based tasks can't be server-verified (we can't
    // confirm someone actually visited an external site), so this at least
    // stops instant claim-without-clicking. It's not real verification, just
    // a reasonable minimum.
    const claimBtn = document.getElementById('task-claim-btn');
    if (claimBtn) {
        let remaining = 10;
        const countdownEl = document.getElementById('task-claim-countdown');
        const timer = setInterval(() => {
            remaining--;
            if (!document.getElementById('task-claim-countdown')) { clearInterval(timer); return; }
            if (remaining <= 0) {
                clearInterval(timer);
                claimBtn.disabled = false;
                claimBtn.innerHTML = '🎁 Claim Reward';
            } else {
                countdownEl.textContent = remaining;
            }
        }, 1000);
    }
}

async function completeTask(taskId, taskToken) {
    const r = await apiPost('earn', { action: 'taskComplete', taskId, startTime: taskToken?.startTime, signature: taskToken?.signature });
    document.getElementById('modal-root').innerHTML = ''; // close sheet
    if (r.ok) {
        toast(`+${r.rewardWtc} CN added!`, 'success');
        triggerBurst(document.querySelector(`button[data-task="${taskId}"]`) || document.body);
        showCongrats(`+${r.rewardWtc} CN`, '✅');
        await refreshUser();

        // ── Vanishes the completed task's card with an animation, then refreshes the list ──
        const refreshActiveTab = () => {
            if (state.activeTab === 'earning') renderEarningTab();
            else if (state.activeTab === 'task') renderTaskTab();
        };
        const card = document.querySelector(`[data-task-card="${taskId}"]`);
        if (card) {
            card.classList.add('task-vanish');
            setTimeout(refreshActiveTab, 480);
        } else {
            refreshActiveTab();
        }
    }
    else if (r.alreadyDone) { toast('You already completed this task.', 'info'); }
    else if (r.error === 'not_member') { toast('Not a member yet — join first, then verify.', 'error'); }
    else { toast(errorText(r.error), 'error'); }
}

// ══════════════════════════════════════════════════════════════
// USER REFRESH / INIT
// ══════════════════════════════════════════════════════════════
// Season 3 — IP-already-in-use gate. Shown before the app root is ever
// built (init() returns right after this), so there is no state.user yet
// to protect; this is purely a "come back differently" screen.
// ⚠️ NEW — shown when init() can't reach the backend at all (timeout on a
// slow connection, 500, cold-start DB failure, etc.) instead of leaving the
// user staring at the splash screen's static "92%" bar forever with no way
// out except force-closing the app.
function showConnectionErrorScreen() {
    const splashEl = document.getElementById('splash');
    if (splashEl) splashEl.remove();
    document.getElementById('app-root').innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px; text-align:center;">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--coin)" stroke-width="2" style="margin-bottom:18px;"><path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
            <div style="font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--coin);">Connection Problem</div>
            <div class="muted" style="font-size:13.5px; line-height:1.7; margin-top:10px; max-width:320px;">Couldn't reach the server — your connection might be slow or unstable right now.</div>
            <button class="btn btn-primary" id="conn-retry-btn" style="max-width:340px; margin-top:22px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Try again
            </button>
        </div>`;
    document.getElementById('conn-retry-btn').onclick = () => { location.reload(); };
}

function showIpInUseScreen(owner) {
    const initials = (owner?.firstName || '?').trim().charAt(0).toUpperCase();
    const handle = owner?.telegramUsername ? `@${owner.telegramUsername}` : 'private';
    document.getElementById('app-root').innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px; text-align:center;">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="var(--coin)" stroke-width="2" style="margin-bottom:18px;"><path d="M5 12.5a11 11 0 0114 0M8.5 16a6 6 0 017 0"/><circle cx="12" cy="19.5" r="1.2" fill="var(--coin)" stroke="none"/></svg>
            <div style="font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--coin);">Device Already In Use</div>
            <div class="muted" style="font-size:13.5px; line-height:1.7; margin-top:10px; max-width:320px;">This device is already linked to another account.<br>Log in with that account, or claim this device for this one below.</div>

            <div class="card" style="width:100%; max-width:340px; margin-top:24px; text-align:left; display:flex; align-items:center; gap:12px;">
                <div style="width:42px; height:42px; border-radius:50%; background:var(--coin-soft); color:var(--coin); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); flex-shrink:0;">${initials}</div>
                <div style="flex:1; min-width:0;">
                    <div style="font-weight:600; font-size:14px;">${owner?.firstName || 'Unknown user'}</div>
                    <div class="muted" style="font-size:12px;">${handle} · ID <span class="mono-num">${owner?.id || '—'}</span></div>
                </div>
            </div>

            <button class="btn btn-primary" id="ip-retry-btn" style="max-width:340px; margin-top:22px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg> Try again
            </button>
            <button class="btn btn-outline" id="ip-switch-btn" style="max-width:340px; margin-top:10px;">Switch account (resets my balance)</button>
            <div class="muted" style="font-size:11px; margin-top:14px; max-width:320px; line-height:1.6;">Switching claims this connection for your account but resets your CN and USDT balance to zero.</div>
        </div>`;

    document.getElementById('ip-retry-btn').onclick = () => { location.reload(); };
    document.getElementById('ip-switch-btn').onclick = async (e) => {
        const confirmed = await new Promise((resolve) => {
            if (tg?.showConfirm) tg.showConfirm('This will reset your entire balance to zero. Continue?', resolve);
            else resolve(confirm('This will reset your entire balance to zero. Continue?'));
        });
        if (!confirmed) return;
        e.target.disabled = true;
        e.target.textContent = 'Switching…';
        const r = await apiPost('user', { action: 'switchAccount', initData: TG_INIT_DATA, fingerprint: await generateDeviceFingerprint() });
        if (r && r.ok) {
            location.reload();
        } else {
            toast(r?.error || 'Could not switch account', 'error');
            e.target.disabled = false;
            e.target.textContent = 'Switch account (resets my balance)';
        }
    };
}

async function refreshUser() {
    const r = await apiGet(`user?action=profile&initData=${encodeURIComponent(TG_INIT_DATA)}`);
    if (r.ok) {
        state.user = r.user;
        // Ban gate — if user is banned, show ban screen and stop everything
        if (r.user?.isBanned) {
            document.getElementById('app-root').innerHTML = '';
            const appealUrl = `https://t.me/Clover_nest_bot?start=appeal_${USER_ID}`;
            document.getElementById('modal-root').innerHTML = `
                <div style="position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;z-index:999;">
                    <div style="font-size:52px;margin-bottom:20px;">⛔</div>
                    <div style="font-family:var(--font-display);font-weight:700;font-size:22px;margin-bottom:12px;">Account Banned</div>
                    <div style="color:var(--ink-muted);font-size:14px;line-height:1.7;margin-bottom:24px;">Your account has been banned for using multiple accounts on the same device.<br><br>If you believe this is a mistake, tap below to request a review from the admin.</div>
                    <a href="${appealUrl}" target="_blank" class="btn btn-primary" style="width:auto; padding:0 22px; text-decoration:none;">🆘 Request Review</a>
                </div>`;
            throw new Error('banned'); // stop further execution in init()
        }
        return;
    }
    // ⚠️ FIX — previously, if r.ok was false (network timeout, 500, cold-start
    // failure, etc.) this function just silently returned with state.user
    // left unset — no error, no retry, nothing. init() would then carry on as
    // if everything succeeded. Now it throws, so init()'s catch block below
    // can show a real "connection failed, tap to retry" screen instead of
    // either hanging or silently rendering a broken/empty app.
    throw new Error(r.error === 'timeout' ? 'connection_timeout' : 'connection_failed');
}

async function init() {
    const splashStart = performance.now();

    // ── Telegram-only gate ── matches the original app's behavior: wait briefly
    // for Telegram's WebApp bridge to deliver initData, and if it never does
    // (because this was opened in a regular browser, not via Telegram), block
    // entirely instead of silently falling back to a fake/demo identity.
    if (!hydrateDisplayUserFields()) {
        await new Promise(r => setTimeout(r, 800));
        if (!hydrateDisplayUserFields()) {
            await new Promise(r => setTimeout(r, 1500));
        }
    }
    if (!TG_INIT_DATA || !hydrateDisplayUserFields()) {
        document.getElementById('splash').remove();
        document.getElementById('app-root').innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:16px; text-align:center; padding:0 30px;">
                <div style="font-size:48px;">📱</div>
                <div style="font-family:var(--font-display); font-weight:700; font-size:17px;">Open this in Telegram</div>
                <div class="muted" style="font-size:13px; line-height:1.6;">CLOVER NEST only works inside the Telegram app. Please open it via the Clover Nest bot.</div>
            </div>`;
        return;
    }

    const initRes = await apiPost('user', { action: 'init', fingerprint: await generateDeviceFingerprint() });
    if (initRes && initRes.ok === false && initRes.error === 'ip_in_use') {
        const splashEl = document.getElementById('splash');
        if (splashEl) splashEl.remove();
        showIpInUseScreen(initRes.owner);
        return;
    }
    // ⚠️ FIX — any OTHER init failure (timeout, 500, cold-start DB error, etc.)
    // used to be silently ignored here — execution just carried on into
    // refreshUser() as if init had succeeded. Now any non-ip_in_use failure
    // goes straight to the retry screen instead of limping forward.
    if (!initRes || initRes.ok === false) {
        showConnectionErrorScreen();
        return;
    }
    try {
        await refreshUser();
    } catch (e) {
        if (e.message === 'banned') {
            // Ban screen already shown in refreshUser() — remove splash and stop
            const splash = document.getElementById('splash');
            if (splash) { splash.classList.add('out'); setTimeout(() => splash.remove(), 550); }
            return;
        }
        // ⚠️ FIX — connection_timeout / connection_failed / any other unexpected
        // error now shows a visible retry screen instead of either hanging on
        // the static "92%" splash forever (old timeout-less fetch) or, if it
        // did resolve, silently proceeding with no user data and breaking
        // downstream renders with no explanation to the user.
        showConnectionErrorScreen();
        return;
    }

    // Splash stays for at least 900ms so its entrance animation is always seen,
    // even when the network is fast — avoids an abrupt flash-then-gone feel.
    const elapsed = performance.now() - splashStart;
    if (elapsed < 900) await new Promise(r => setTimeout(r, 900 - elapsed));
    const splash = document.getElementById('splash');
    splash.classList.add('out');
    setTimeout(() => splash.remove(), 550);

    const joinCheck = await apiGet(`user?action=checkJoin&initData=${encodeURIComponent(TG_INIT_DATA)}`);
    if (joinCheck.joined) startApp();
    else showJoinGate({ leftAfterVerifying: joinCheck.leftAfterVerifying }, startApp);
}

function startApp() {
    renderShell();
    switchTab('home');
    startJoinWatcher();
    setTimeout(checkPendingGift, 900); // after the splash/home entrance animation, so the two don't show at once
}

async function generateDeviceFingerprint() {
    try {
        const parts = [];
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 200; canvas.height = 50;
        ctx.textBaseline = 'top'; ctx.font = '14px Arial'; ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = '#069'; ctx.fillText('CLOVERNEST-fp', 2, 15);
        parts.push(canvas.toDataURL());
        parts.push(screen.width + 'x' + screen.height + 'x' + screen.colorDepth);
        parts.push(navigator.language || '');
        parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || '');
        parts.push(navigator.hardwareConcurrency || '');
        const data = new TextEncoder().encode(parts.join('|||'));
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch { return null; }
}

// ⚠️ NEW — absolute last-resort safety net. If ANY future script (ad SDK or
// otherwise) ever blocks parsing again, or init() throws something not
// caught above, this guarantees the user is never stuck on the static "92%"
// splash forever — after 20s, if the splash is still there, force the
// connection-error/retry screen.
setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash && !splash.classList.contains('out')) showConnectionErrorScreen();
}, 20000);

init();
</script>
